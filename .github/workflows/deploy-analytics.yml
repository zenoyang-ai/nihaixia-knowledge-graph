name: Deploy Analytics Function (CloudBase)

on:
  push:
    branches: [main]
    paths:
      - 'cloudbase/functions/nihaixia-analytics/**'
      - '.github/workflows/deploy-analytics.yml'
  workflow_dispatch:

jobs:
  deploy-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@3.6.4

      - name: Login to CloudBase (non-interactive, CAM API key)
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
        run: tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"

      - name: Update nihaixia-analytics code only (preserve console env vars & triggers)
        working-directory: cloudbase
        run: tcb fn code update nihaixia-analytics

      - name: Verify live health & Feishu config preserved
        run: |
          EXPECTED_VERSION=$(node -e '
            const fs = require("fs");
            const src = fs.readFileSync("cloudbase/functions/nihaixia-analytics/index.js", "utf8");
            const m = src.match(/const VERSION = [\x27"]([^\x27"]+)[\x27"]/);
            if (!m) throw new Error("VERSION not found");
            process.stdout.write(m[1]);
          ')
          echo "Expecting live nihaixia-analytics version: $EXPECTED_VERSION"
          for i in $(seq 1 12); do
            sleep 5
            RESP=$(curl -sS -m 15 "https://zeno-d9g0gdvw4a57635c0-1452182285.ap-shanghai.app.tcloudbase.com/nihaixia-analytics" || true)
            echo "Attempt $i: $RESP"
            if node -e '
              const d = JSON.parse(process.argv[1]);
              if (d.ok && d.version === process.argv[2] && d.feishu_configured) process.exit(0);
              process.exit(1);
            ' "$RESP" "$EXPECTED_VERSION" 2>/dev/null; then
              echo "Verified nihaixia-analytics v$EXPECTED_VERSION live with feishu_configured=true"
              exit 0
            fi
          done
          echo "Timed out waiting for nihaixia-analytics v$EXPECTED_VERSION" >&2
          exit 1
